<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/icon.svg">
<title>MCBShare</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--text:#000;--muted:#6c6c70;--line:#d1d1d6;--accent:#0a84ff;--bad:#d70015}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#98989f;--line:#38383a;--bad:#ff453a}}
*{box-sizing:border-box}
body{margin:0;padding:max(24px,env(safe-area-inset-top)) 16px 32px;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:560px;margin:auto}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.step{background:var(--card);border-radius:12px;padding:14px;margin-top:10px}
.step h2{font-size:17px;margin:0 0 6px}
.step p{margin:6px 0}
b{font-weight:600}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:15px ui-monospace,Menlo,monospace;margin-top:6px}
button,a.btn{display:block;box-sizing:border-box;text-align:center;text-decoration:none;width:100%;min-height:46px;margin-top:8px;padding:11px;border:0;border-radius:11px;background:var(--accent);color:#fff;font:600 16px -apple-system,system-ui,sans-serif;cursor:pointer}
.bad{color:var(--bad)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="page"></main>
<script>
const tr = (navigator.language || '').toLowerCase().startsWith('tr');
// Paylaşılan kısayolun iCloud bağlantısı. Ekleyen kişiye adres ve anahtar sorulur; içinde kimsenin bilgisi yoktur.
const SHORTCUT_LINK = 'https://www.icloud.com/shortcuts/2e15d180d89148a88c439cbc70dd55e5';

const T = tr ? {
  title: 'iOS Kısayolu kurulumu',
  sub: 'Kısayol, iPhone\'un Paylaş menüsünden bu PC\'ye dosya gönderir. Bu sayfayı açık tutun; adımlar arasında Kısayollar ile buraya gidip geleceksiniz.',
  noKey: 'Bu sayfada anahtar yok. PC\'de Ayarlar > iOS Kısayolu bölümündeki QR\'ı okutun.',
  copy: 'Kopyala', copied: 'Kopyalandı ✓', manual: 'Seçildi, Kopyala\'ya dokunun', add: 'Kısayolu ekle',
  steps: [
    ['Adresi kopyalayın', ['Önce bu PC\'nin adresini kopyalayın:'], 'host'],
    ['Kısayolu ekleyin', ['Aşağıdaki düğmeye dokunun; Kısayollar açılır. <b>Kestirmeyi Ayarla</b> ekranındaki ilk soru <b>Pc adresi nedir?</b> olur: kutuya basılı tutup <b>Yapıştır</b>\'ı seçin.'], 'link'],
    ['Anahtarı kopyalayın', ['Safari\'ye, bu sayfaya dönün ve anahtarı kopyalayın:'], 'key', 'Kısayollar\'a dönüp <b>Anahtar nedir?</b> sorusuna yapıştırın, sonra kısayolu ekleyin.'],
    ['Deneyin', ['Fotoğraflar\'da bir fotoğraf açın, <b>Paylaş</b>\'a dokunun ve listeden <b>MCBShare</b>\'i seçin. Ağ izni sorulursa <b>Her Zaman İzin Ver</b>\'i seçin. Fotoğraf PC\'ye gelmeli.', 'PC ile telefon aynı Wi-Fi\'de olmalı. PC\'nin adresi değişirse kısayolu düzenleyip en üstteki ilk <b>Metin</b> kutusuna yeni adresi yazın.']],
  ]
} : {
  title: 'iOS Shortcut setup',
  sub: 'The Shortcut sends files to this PC from the iPhone Share menu. Keep this page open; you\'ll switch between Shortcuts and this page.',
  noKey: 'This page has no key. Scan the QR code in Settings > iOS Shortcut on your PC.',
  copy: 'Copy', copied: 'Copied ✓', manual: 'Selected, tap Copy', add: 'Add the Shortcut',
  steps: [
    ['Copy the address', ['First copy this PC\'s address:'], 'host'],
    ['Add the Shortcut', ['Tap the button below; Shortcuts opens. The first question is <b>Pc adresi nedir?</b> (the PC\'s address): touch and hold the box and choose <b>Paste</b>.'], 'link'],
    ['Copy the key', ['Go back to this page in Safari and copy the key:'], 'key', 'Return to Shortcuts, paste it into <b>Anahtar nedir?</b> (the key), then add the Shortcut.'],
    ['Try it', ['Open a photo in Photos, tap <b>Share</b> and pick <b>MCBShare</b>. If asked for network access, choose <b>Always Allow</b>. The photo should reach your PC.', 'The PC and phone must be on the same Wi-Fi. If the PC\'s address changes, edit the Shortcut and type the new address into the first <b>Text</b> box at the top.']],
  ]
};

const key = new URLSearchParams(location.hash.slice(1)).get('key');
// Kısayol "http://" ekler; kullanıcıya yalnızca adres:port kalır.
const values = { host: location.host, key };
const page = document.getElementById('page');
document.documentElement.lang = tr ? 'tr' : 'en';

function add(parent, tag, html, cls) {
  const e = document.createElement(tag);
  if (html) e.innerHTML = html;
  if (cls) e.className = cls;
  parent.appendChild(e);
  return e;
}

function copyField(parent, value) {
  const input = add(parent, 'input');
  input.readOnly = true;
  input.value = value;
  const button = add(parent, 'button');
  button.textContent = T.copy;
  button.onclick = async () => {
    input.focus();
    input.setSelectionRange(0, value.length);
    // Sayfa HTTP üzerinden açık olduğu için pano API'si çoğu telefonda yoktur.
    let ok = false;
    try {
      if (navigator.clipboard) { await navigator.clipboard.writeText(value); ok = true; }
      else ok = document.execCommand('copy');
    } catch {
      try { ok = document.execCommand('copy'); } catch {}
    }
    button.textContent = ok ? T.copied : T.manual;
    setTimeout(() => { button.textContent = T.copy; }, 2000);
  };
}

add(page, 'h1').textContent = T.title;
if (!key) {
  add(page, 'p', '', 'bad').textContent = T.noKey;
} else {
  add(page, 'p', '', 'sub').textContent = T.sub;
  T.steps.forEach(([title, lines, ...rest], i) => {
    const card = add(page, 'section', '', 'step');
    add(card, 'h2').textContent = `${i + 1}. ${title}`;
    lines.forEach(line => add(card, 'p', line));
    rest.forEach(item => {
      if (item === 'link') {
        const a = add(card, 'a', '', 'btn');
        a.href = SHORTCUT_LINK;
        a.textContent = T.add;
      }
      else if (item in values) copyField(card, values[item]);
      else add(card, 'p', item);
    });
  });
}
</script>
</body>
</html>
