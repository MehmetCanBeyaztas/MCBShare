<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MCBShare">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<title>MCBShare</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--text:#000;--muted:#6c6c70;--line:#d1d1d6;--accent:#0a84ff;--ok:#248a3d;--bad:#d70015}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--muted:#98989f;--line:#38383a;--ok:#30d158;--bad:#ff453a}}
*{box-sizing:border-box}
body{margin:0;padding:max(24px,env(safe-area-inset-top)) 16px 32px;background:var(--bg);color:var(--text);font:17px/1.35 -apple-system,system-ui,sans-serif}
main{max-width:560px;margin:auto}
h1{font-size:32px;margin:0 0 4px}
h2{font-size:20px;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 20px;overflow-wrap:anywhere}
button,.pick{display:block;width:100%;min-height:50px;padding:13px;border:0;border-radius:13px;background:var(--accent);color:#fff;font:600 17px -apple-system,system-ui,sans-serif;text-align:center;cursor:pointer}
button.quiet{background:var(--card);color:var(--accent)}
button:disabled{opacity:.5}
input[type=file]{position:absolute;opacity:0;width:0;height:0}
input[type=text],textarea{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font:17px -apple-system,system-ui,sans-serif;margin-bottom:10px}
textarea{min-height:92px;resize:vertical}
.row{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:8px}
.name{overflow-wrap:anywhere}
.state{color:var(--muted);font-size:14px;margin-top:2px}
.state.ok{color:var(--ok)}.state.bad{color:var(--bad)}
progress{width:100%;height:4px;margin-top:8px;accent-color:var(--accent);display:block}
.banner{background:var(--card);border-radius:12px;padding:12px 14px;color:var(--bad);margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.incoming{margin:0 0 12px;outline:2px solid var(--accent)}
.incoming textarea{background:var(--bg);margin:8px 0 10px}
.incoming button.quiet{background:var(--bg)}
.open{display:block;text-align:center;color:var(--accent);padding:12px 0 2px;overflow-wrap:anywhere}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>MCBShare</h1>
  <p class="sub" id="sub"></p>
  <div class="banner" id="banner" hidden></div>

  <section id="pair" hidden>
    <input type="text" id="deviceName" autocomplete="off" maxlength="60">
    <button id="pairBtn"></button>
  </section>

  <section id="noKey" hidden><p id="noKeyText"></p></section>

  <section id="app" hidden>
    <label class="pick" for="files" id="pickLabel"></label>
    <input type="file" id="files" multiple>
    <div class="state" id="keepOpen" hidden></div>
    <div id="list"></div>

    <h2 id="clipTitle"></h2>
    <div class="row incoming" id="incoming" hidden>
      <div class="state" id="incomingLabel"></div>
      <textarea id="incomingText" readonly></textarea>
      <div class="two">
        <button id="incomingCopy"></button>
        <button id="incomingClose" class="quiet"></button>
      </div>
      <a class="open" id="incomingOpen" target="_blank" rel="noreferrer" hidden></a>
    </div>
    <textarea id="clip"></textarea>
    <button id="clipSend"></button>
    <div class="state" id="clipState"></div>
  </section>
</main>
<script>
const tr = (navigator.language || '').toLowerCase().startsWith('tr');
const T = tr ? {
  sub: 'Dosyaları PC\'ye gönder', namePh: 'Cihaz adı', pair: 'Bu telefonu bağla', pick: 'Dosya seç',
  noKey: 'Bu telefon henüz bağlı değil. PC\'deki MCBShare panelinden eşleşme QR\'ını okutun.',
  badToken: 'Eşleşme kodu geçersiz. PC\'deki QR\'ı yeniden okutun.', removed: 'Bu telefonun erişimi kaldırılmış. PC\'deki QR\'ı yeniden okutun.',
  offline: 'PC\'ye ulaşılamıyor. PC uykuda veya kapalı olabilir ya da aynı Wi-Fi\'de olmayabilirsiniz.',
  keepOpen: 'Gönderim bitene kadar bu sayfayı açık tutun; telefon kilitlenirse aktarım duraklar.',
  preparing: 'Hazırlanıyor…', waiting: 'Sırada', retry: 'Bağlantı koptu, yeniden deneniyor…', done: 'PC\'ye gönderildi ✓', dup: 'Zaten PC\'de ✓',
  full: 'PC\'de yeterli yer yok', failed: 'Gönderilemedi', clip: 'Pano', clipPh: 'Metin veya link', clipSend: 'PC\'ye gönder', clipGet: 'PC\'den al',
  clipSent: 'Gönderildi ✓', incoming: 'PC\'den metin', copy: 'Kopyala', copied: 'Kopyalandı ✓', copyManual: 'Seçili, basılı tutup kopyalayın', close: 'Kapat', open: 'Linki aç'
} : {
  sub: 'Send files to your PC', namePh: 'Device name', pair: 'Connect this phone', pick: 'Choose files',
  noKey: 'This phone isn\'t connected yet. Scan the pairing QR code in the MCBShare panel on your PC.',
  badToken: 'The pairing code isn\'t valid. Scan the QR code on your PC again.', removed: 'This phone\'s access was removed. Scan the QR code on your PC again.',
  offline: 'Can\'t reach your PC. It may be asleep or off, or you may not be on the same Wi-Fi.',
  keepOpen: 'Keep this page open until sending finishes; locking the phone pauses the transfer.',
  preparing: 'Preparing…', waiting: 'Waiting', retry: 'Connection lost, retrying…', done: 'Sent to PC ✓', dup: 'Already on PC ✓',
  full: 'Not enough space on the PC', failed: 'Couldn\'t send', clip: 'Clipboard', clipPh: 'Text or link', clipSend: 'Send to PC', clipGet: 'Get from PC',
  clipSent: 'Sent ✓', incoming: 'Text from PC', copy: 'Copy', copied: 'Copied ✓', copyManual: 'Selected, press and hold to copy', close: 'Close', open: 'Open link'
};

const CHUNK = 8 * 1024 * 1024;
const MAX_RETRIES = 60;
const STALL_MS = 30 * 1000;
const STALL_FINISH_MS = 5 * 60 * 1000;
const $ = id => document.getElementById(id);
document.documentElement.lang = tr ? 'tr' : 'en';
$('sub').textContent = T.sub;
$('deviceName').placeholder = T.namePh;
$('pairBtn').textContent = T.pair;
$('pickLabel').textContent = T.pick;
$('noKeyText').textContent = T.noKey;
$('clipTitle').textContent = T.clip;
$('clip').placeholder = T.clipPh;
$('clipSend').textContent = T.clipSend;
$('incomingLabel').textContent = T.incoming;
$('incomingCopy').textContent = T.copy;
$('incomingClose').textContent = T.close;
$('incomingOpen').textContent = T.open;

function storedKey() { try { return localStorage.getItem('mcbKey'); } catch { return null; } }
function storeKey(k) { try { localStorage.setItem('mcbKey', k); } catch {} }
function dropKey() { try { localStorage.removeItem('mcbKey'); } catch {} }

const hash = new URLSearchParams(location.hash.slice(1));
let key = storedKey() || hash.get('k');
const pairToken = hash.get('pair');

function show(id) { for (const s of ['pair', 'noKey', 'app']) $(s).hidden = s !== id; }
function banner(text) { $('banner').hidden = !text; $('banner').textContent = text || ''; }

// Anahtar # sonrasında tutulur: ana ekrana eklenen kısayol kendi deposuyla açılsa da bağlı kalır.
function useKey(k) {
  key = k;
  storeKey(k);
  history.replaceState(null, '', '/#k=' + encodeURIComponent(k));
  show('app');
}

async function init() {
  if (pairToken && !key) {
    $('deviceName').value = /iPhone/.test(navigator.userAgent) ? 'iPhone' : /Android/.test(navigator.userAgent) ? 'Android' : '';
    show('pair');
    return;
  }
  if (!key) { show('noKey'); return; }
  try {
    const r = await fetch('/api/me', { headers: { 'X-MCB-Key': key } });
    if (r.status === 401) { dropKey(); key = null; banner(T.removed); show(pairToken ? 'pair' : 'noKey'); return; }
    useKey(key);
  } catch {
    banner(T.offline);
    show('app');
  }
}

$('pairBtn').onclick = async () => {
  banner('');
  $('pairBtn').disabled = true;
  try {
    const r = await fetch('/api/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: pairToken, name: $('deviceName').value })
    });
    if (!r.ok) { banner(T.badToken); return; }
    useKey((await r.json()).key);
    pollText();
  } catch { banner(T.offline); }
  finally { $('pairBtn').disabled = false; }
};

function uploadId(f) {
  let h = 2166136261;
  for (const c of `${f.name}|${f.size}|${f.lastModified}`) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return 'w' + (h >>> 0).toString(16) + '-' + f.size.toString(16) + '-' + f.lastModified.toString(16);
}

function formatSpeed(bytesPerSec) {
  if (bytesPerSec >= 1048576) return (bytesPerSec / 1048576).toFixed(1) + ' MB/s';
  return Math.round(bytesPerSec / 1024) + ' KB/s';
}

function clientLog(message) {
  fetch('/api/clientlog', {
    method: 'POST', headers: { 'Content-Type': 'application/json', 'X-MCB-Key': key },
    body: JSON.stringify({ message })
  }).catch(() => {});
}

let currentXhr = null;
let hiddenAt = 0;

// Safari arka planda isteği sessizce dondurabilir: geri dönünce bekleyen istek bırakılıp kaldığı yerden devam edilir.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (currentXhr && Date.now() - hiddenAt > 3000) {
    currentXhr.stopReason = 'returned-from-background';
    currentXhr.abort();
  }
});

function sendChunk(url, blob, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    let last = Date.now(), allSent = false;
    // Son parçadan sonra PC dosyayı işlerken ilerleme olmaz; bu yüzden o aşamada daha uzun beklenir.
    const watchdog = setInterval(() => {
      if (!document.hidden && Date.now() - last > (allSent ? STALL_FINISH_MS : STALL_MS)) {
        x.stopReason = 'stalled';
        x.abort();
      }
    }, 2000);
    const done = () => { clearInterval(watchdog); if (currentXhr === x) currentXhr = null; };
    currentXhr = x;
    x.open('POST', url);
    x.setRequestHeader('X-MCB-Key', key);
    x.upload.onprogress = e => { last = Date.now(); allSent = e.loaded >= blob.size; onProgress(e.loaded); };
    x.onload = () => {
      done();
      let body = {};
      try { body = JSON.parse(x.responseText); } catch {}
      resolve({ status: x.status, body });
    };
    x.onerror = () => { done(); reject(new Error('network-error')); };
    x.onabort = () => { done(); reject(new Error(x.stopReason || 'aborted')); };
    x.send(blob);
  });
}

async function uploadFile(f, row, index, total) {
  const id = uploadId(f);
  let offset = 0, retries = 0;
  const started = performance.now();
  let startOffset = null;

  const getOffset = async () => {
    const r = await fetch('/upload/status?id=' + encodeURIComponent(id), { headers: { 'X-MCB-Key': key } });
    if (!r.ok) throw new Error('status');
    return (await r.json()).offset;
  };

  while (true) {
    try {
      if (retries > 0 || offset === 0) offset = await getOffset();
      if (startOffset === null) startOffset = offset;
      const end = Math.min(offset + CHUNK, f.size);
      const params = new URLSearchParams({
        name: f.name, id, size: f.size, offset, modified: f.lastModified, batchIndex: index, batchTotal: total
      });
      const base = offset;
      const res = await sendChunk('/upload?' + params, f.slice(offset, end), loaded => {
        const sent = base + loaded;
        const seconds = (performance.now() - started) / 1000;
        row.bar.value = f.size ? sent / f.size : 1;
        row.setState(Math.round(row.bar.value * 100) + '% · ' + formatSpeed((sent - startOffset) / Math.max(seconds, .1)));
      });
      if (res.status === 200) {
        retries = 0;
        banner('');
        offset = res.body.offset;
        if (res.body.complete) {
          row.bar.value = 1;
          row.setState(res.body.duplicate ? T.dup : T.done, 'ok');
          return;
        }
        continue;
      }
      if (res.status === 409 && res.body.error === 'offset_mismatch') { offset = res.body.offset; continue; }
      if (res.status === 409) throw new Error('busy');
      if (res.status === 401) { dropKey(); key = null; banner(T.removed); show('noKey'); row.setState(T.failed, 'bad'); return; }
      clientLog(`${f.name}: HTTP ${res.status} ${res.body.error || ''} at ${offset}/${f.size}`);
      row.setState(res.status === 507 ? T.full : T.failed, 'bad');
      return;
    } catch (err) {
      if (retries === 0) clientLog(`${f.name}: ${err.message} at ${offset}/${f.size}`);
      if (++retries > MAX_RETRIES) {
        clientLog(`${f.name}: gave up at ${offset}/${f.size}`);
        banner(T.offline);
        row.setState(T.failed, 'bad');
        return;
      }
      if (retries >= 3) banner(T.offline);
      row.setState(T.retry);
      await new Promise(r => setTimeout(r, 2000));
    }
  }
}

function addRow(f) {
  const el = document.createElement('div');
  el.className = 'row';
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = f.name;
  const state = document.createElement('div');
  state.className = 'state';
  state.textContent = T.waiting;
  const bar = document.createElement('progress');
  bar.max = 1;
  bar.value = 0;
  el.append(name, state, bar);
  $('list').prepend(el);
  return {
    bar,
    setState(text, cls) { state.textContent = text; state.className = 'state' + (cls ? ' ' + cls : ''); if (cls) bar.hidden = true; }
  };
}

let queue = Promise.resolve();
let active = 0;
$('files').onchange = e => {
  const files = [...e.target.files];
  e.target.value = '';
  const rows = files.map(addRow);
  $('keepOpen').textContent = T.keepOpen;
  $('keepOpen').hidden = false;
  active++;
  queue = queue.then(async () => {
    for (let i = 0; i < files.length; i++) {
      // iCloud'daki bir fotoğraf ilk okumada indirilir; o sürede bu durum görünür.
      rows[i].setState(T.preparing);
      await uploadFile(files[i], rows[i], i + 1, files.length);
    }
    if (--active === 0) $('keepOpen').hidden = true;
  });
};

$('clipSend').onclick = async () => {
  const text = $('clip').value;
  if (!text) return;
  try {
    const r = await fetch('/api/clipboard', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'X-MCB-Key': key },
      body: JSON.stringify({ text })
    });
    $('clipState').textContent = r.ok ? T.clipSent : T.failed;
  } catch { $('clipState').textContent = T.offline; }
};

function seenAt() { try { return Number(localStorage.getItem('mcbClipAt')) || 0; } catch { return shownAt; } }
function markSeen(at) { try { localStorage.setItem('mcbClipAt', String(at)); } catch {} }
let shownAt = 0;

async function pollText() {
  if (!key || document.hidden) return;
  try {
    const r = await fetch('/api/clipboard', { headers: { 'X-MCB-Key': key } });
    // Kaldırılmış cihaz sormayı sürdürürse başarısız deneme sınırına takılır.
    if (r.status === 401) { dropKey(); key = null; banner(T.removed); show('noKey'); return; }
    if (!r.ok) return;
    const body = await r.json();
    if (!body.text || body.at === shownAt || body.at <= seenAt()) return;
    shownAt = body.at;
    $('incomingText').value = body.text;
    $('incomingCopy').textContent = T.copy;
    const isLink = /^https?:\/\/\S+$/i.test(body.text.trim());
    $('incomingOpen').hidden = !isLink;
    if (isLink) $('incomingOpen').href = body.text.trim();
    $('incoming').hidden = false;
  } catch {
    // Bağlantı yoksa sonraki turda yeniden denenir; dosya gönderimi zaten uyarı gösterir.
  }
}

$('incomingCopy').onclick = async () => {
  const box = $('incomingText');
  box.focus();
  box.select();
  box.setSelectionRange(0, box.value.length);
  // Sayfa HTTP üzerinden açık olduğu için pano API'si çoğu telefonda yoktur.
  let ok = false;
  try {
    if (navigator.clipboard) { await navigator.clipboard.writeText(box.value); ok = true; }
    else ok = document.execCommand('copy');
  } catch {
    try { ok = document.execCommand('copy'); } catch {}
  }
  $('incomingCopy').textContent = ok ? T.copied : T.copyManual;
};

$('incomingClose').onclick = () => {
  markSeen(shownAt);
  $('incoming').hidden = true;
};

setInterval(pollText, 3000);
document.addEventListener('visibilitychange', pollText);

init();
</script>
</body>
</html>
